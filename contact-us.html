<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Contact Us
</title>

<link
rel="stylesheet"
href="contact-us.css"
>

</head>

<body>

<div class="contactUsPage">

  <a
    class="contactUsBackHomeLink"
    href="index.html"
  >
    ← Back to Home
  </a>


  <!-- ======================================
       WEBSITE CONTACT US FORM
  ======================================= -->

  <div class="contactUsFormWrap">

    <form id="contactUsForm">

      <label for="contactUsName">
        Name (optional)
      </label>

      <input
        type="text"
        id="contactUsName"
        autocomplete="name"
        enterkeyhint="next"
      >


      <label for="contactUsEmail">
        Email
      </label>

      <input
        type="email"
        id="contactUsEmail"
        autocomplete="email"
        required
        enterkeyhint="next"
      >


      <label for="contactUsType">
        What can we help you with?
      </label>

      <select
        id="contactUsType"
        required
      >

        <option value="">
          Select one
        </option>

        <option value="general_contact">
          General Question / Comment
        </option>

        <option value="church_pastor_inquiry">
          Church / Pastor Inquiry
        </option>

        <option value="church_participation_pricing">
          Church Participation / Pricing
        </option>

        <option value="streetkeeper_membership">
          Streetkeeper Membership Question
        </option>

        <option value="app_technical_support">
          App / Technical Support
        </option>

        <option value="map_street_problem">
          Map / Street Problem
        </option>

        <option value="billing_question">
          Billing Question
        </option>

      </select>


      <!-- ======================================
           MAP / STREET PROBLEM DETAILS
      ======================================= -->

      <div
        id="contactUsMapStreetFields"
        class="contactUsHidden"
      >

        <label for="contactUsMapProblemType">
          What problem are you having?
        </label>

        <select id="contactUsMapProblemType">

          <option value="">
            Select one
          </option>

          <option value="city_not_found">
            I can't find my city
          </option>

          <option value="street_not_found">
            I can't find my street
          </option>

          <option value="city_wont_open">
            My city won't open
          </option>

          <option value="street_cannot_select_claim">
            My street appears, but I can't select or claim it
          </option>

          <option value="duplicate_street">
            My street appears more than once
          </option>

          <option value="wrong_city">
            My street appears in the wrong city
          </option>

          <option value="other_map_street_problem">
            Other map or street problem
          </option>

        </select>


        <label for="contactUsMapState">
          State / Jurisdiction
        </label>

        <select
          id="contactUsMapState"
          autocomplete="address-level1"
        >

          <option value="">
            Select State / Jurisdiction
          </option>

          <option value="AL">Alabama</option>
          <option value="AK">Alaska</option>
          <option value="AS">American Samoa</option>
          <option value="AZ">Arizona</option>
          <option value="AR">Arkansas</option>
          <option value="CA">California</option>
          <option value="CO">Colorado</option>
          <option value="CT">Connecticut</option>
          <option value="DE">Delaware</option>
          <option value="DC">District of Columbia</option>
          <option value="FL">Florida</option>
          <option value="GA">Georgia</option>
          <option value="GU">Guam</option>
          <option value="HI">Hawaii</option>
          <option value="ID">Idaho</option>
          <option value="IL">Illinois</option>
          <option value="IN">Indiana</option>
          <option value="IA">Iowa</option>
          <option value="KS">Kansas</option>
          <option value="KY">Kentucky</option>
          <option value="LA">Louisiana</option>
          <option value="ME">Maine</option>
          <option value="MD">Maryland</option>
          <option value="MA">Massachusetts</option>
          <option value="MI">Michigan</option>
          <option value="MN">Minnesota</option>
          <option value="MS">Mississippi</option>
          <option value="MO">Missouri</option>
          <option value="MT">Montana</option>
          <option value="NE">Nebraska</option>
          <option value="NV">Nevada</option>
          <option value="NH">New Hampshire</option>
          <option value="NJ">New Jersey</option>
          <option value="NM">New Mexico</option>
          <option value="NY">New York</option>
          <option value="NC">North Carolina</option>
          <option value="ND">North Dakota</option>
          <option value="MP">Northern Mariana Islands</option>
          <option value="OH">Ohio</option>
          <option value="OK">Oklahoma</option>
          <option value="OR">Oregon</option>
          <option value="PA">Pennsylvania</option>
          <option value="PR">Puerto Rico</option>
          <option value="RI">Rhode Island</option>
          <option value="SC">South Carolina</option>
          <option value="SD">South Dakota</option>
          <option value="TN">Tennessee</option>
          <option value="TX">Texas</option>
          <option value="UT">Utah</option>
          <option value="VI">U.S. Virgin Islands</option>
          <option value="VT">Vermont</option>
          <option value="VA">Virginia</option>
          <option value="WA">Washington</option>
          <option value="WV">West Virginia</option>
          <option value="WI">Wisconsin</option>
          <option value="WY">Wyoming</option>

        </select>


        <label for="contactUsMapCity">
          City
        </label>

        <div class="contactUsMapCitySearchWrap">

          <input
            type="search"
            id="contactUsMapCity"
            placeholder="Type city name"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="words"
            spellcheck="false"
            enterkeyhint="next"
          >

          <div
            id="contactUsMapCityResults"
            class="contactUsMapCityResults contactUsHidden"
          ></div>

        </div>


        <label for="contactUsMapStreet">
          Street Name
        </label>

        <input
          type="text"
          id="contactUsMapStreet"
          autocomplete="street-address"
          enterkeyhint="next"
        >


        <label for="contactUsMapCounty">
          County (optional)
        </label>

        <input
          type="text"
          id="contactUsMapCounty"
          enterkeyhint="next"
        >


        <label for="contactUsMapNearbyArea">
          Nearby ZIP Code or Area (optional)
        </label>

        <input
          type="text"
          id="contactUsMapNearbyArea"
          enterkeyhint="next"
        >

      </div>


      <label
        id="contactUsMessageLabel"
        for="contactUsMessage"
      >
        Message
      </label>

      <textarea
        id="contactUsMessage"
        rows="6"
        required
      ></textarea>


      <button
        type="submit"
        class="contactUsSubmitBtn"
      >
        Submit
      </button>


      <div
        id="contactUsSuccessMessage"
        class="contactUsSuccess contactUsHidden"
      >
        Thank you. Your message has been received.
      </div>

    </form>

  </div>

</div>

</body>

</html>
